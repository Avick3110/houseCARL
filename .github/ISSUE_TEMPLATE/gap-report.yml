name: Gap / capability request
description: Something you needed houseCARL to do and it couldn't express — a missing filter, verb, parameter, or surface
title: "[GAP] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What you were trying to do, in task terms — the job, not the missing feature.
    validations:
      required: true
  - type: textarea
    id: fell-short
    attributes:
      label: What fell short
      description: >-
        The tool calls you tried and what each returned (errors verbatim where possible). Scrub
        local machine paths and usernames before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround used
      description: How you got the job done anyway (or that you couldn't), and what it cost — extra calls, sampling, manual steps.
    validations:
      required: false
  - type: textarea
    id: ideal
    attributes:
      label: Ideal shape
      description: What the capability would look like if houseCARL had it — a parameter, a verb, a new tool. How often you expect to hit this.
    validations:
      required: false
