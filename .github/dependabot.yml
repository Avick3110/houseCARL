version: 2
updates:
  # NuGet packages referenced by the five .csproj files under src/.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Nifly is our fork build from packages/local; NuGet ranks upstream 1.1.0 above 1.1.0-housecarl.N, later releases still report.
    ignore:
      - dependency-name: "Nifly"
        versions: ["<= 1.1.0"]
      # Microsoft.Extensions.* stays on the 10.0.x line ModelContextProtocol pins; a major bump breaks that.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  # Actions pinned in .github/workflows/*.yml (actions/checkout, actions/setup-dotnet, actions/cache).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
