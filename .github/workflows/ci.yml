# houseCARL CI — a green/red gate on every push to main and every pull request.
# What it does, in plain terms: a fresh Windows machine on GitHub's servers compiles
# houseCARL and runs its re-runnable proof probes. Green = it builds and the core logic
# passes; red = something broke. The probes self-SKIP the parts that need external tools
# (the Creation Kit's Papyrus compiler, BSArch) which aren't installed on the runner, so
# they stay a reliable gate without those tools present.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded in-progress run on the SAME pull request when a newer commit is pushed
# (saves runner time and queue contention while iterating on a PR). Never cancel main-branch
# (push) runs — every commit that lands on main must be verified end-to-end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-probe:
    name: build + probes
    runs-on: windows-latest   # houseCARL is a Windows-only (Skyrim SE) product — match that
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Cache the NuGet package restore across runs (keyed on the project files, which pin the
      # package versions). Trims the restore inside the build step below; the build itself still
      # compiles the whole solution fresh every run.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build the whole solution (Release)
        run: dotnet build housecarl.sln --configuration Release

      # Nearly all CI probes run IN ONE PROCESS via `ci-all` (CI optimization Phase 2A+2B): the big Mutagen
      # assembly loads + JITs once and the schema corpus is reflected once (memoized) instead of ~21x —
      # collapsing ~12 min of per-probe cold starts. The runner runs EVERY probe even if one fails and emits a
      # `::error::` annotation per failure, so the job still goes red on any failure and names which probe(s).
      # The probe set lives in CiAll.cs (single source of truth). See dev/plans/CI_OPTIMIZATION_RESEARCH_2026-06-24.md.
      - name: Probes — all-in-one-process (ci-all)
        run: dotnet src/housecarl-generator/bin/Release/net9.0/housecarl-generator.dll ci-all

      # The second harness (tool-surface 2.0 W7): guards for the 2.0 tool surface are xUnit tests under
      # `dotnet test`, which gives the per-test naming and reporting `ci-all` structurally cannot. Both
      # steps are required and neither is conditional — this is a two-harness window, not a migration in
      # flight.
      #
      # `tier!=bridge` is the one exclusion, and it is about CI only: the bridge test exists so a LOCAL
      # `dotnet test` with no filter also runs `ci-all` (one entry point for a developer). CI already runs
      # ci-all as its own step above, so including the bridge here would run the whole probe suite twice
      # for no extra signal.
      - name: Tests — the 2.0 guard project (dotnet test)
        if: ${{ !cancelled() }}
        run: dotnet test src/housecarl-mcp-tests --configuration Release --no-build --filter "tier!=bridge" --logger "trx;LogFileName=guards.trx"

      # `dotnet test` exits 0 when its filter matches NOTHING — measured. So a filter edit (a new tier, a typo,
      # a test mistagged `bridge`) can take every guard out of CI and leave the step green with no signal. This
      # reads the run's own trx and fails on an empty or failing run, which is also what makes the --logger flag
      # above load-bearing rather than an artifact nobody opens. The floor is derived from the run, not a pinned
      # number: it says "something ran and nothing failed", and the count is printed so a collapse is visible.
      - name: Tests — the run was not empty (a filter that matches nothing exits 0)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter guards.trx src/housecarl-mcp-tests/TestResults |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $trx) { throw "No guards.trx was produced - the test step did not run to completion." }
          $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          "guards.trx: total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed)"
          if ([int]$c.executed -eq 0) { throw "The guard suite selected ZERO tests. The filter excludes everything it should not." }
          if ([int]$c.failed -ne 0) { throw "$($c.failed) guard test(s) failed." }

      # The residue countdown (ADR 0003, docs/decisions/): how much of the OLD
      # harness is left. This prints the MEASUREMENT, not the committed baseline file. Printing the file was
      # the first shape, and it was only honest for the two gated numbers: probeLines is deliberately
      # ungated, so a legal in-place guard edit moves it and CI would have gone on printing the stale figure
      # as though it had been measured. Re-running the derivation costs about a second and cannot drift,
      # which a second copy of the derivation written in yaml would. W7 is not complete while these are
      # above zero.
      - name: Residue countdown — what is left in the old probe harness
        if: ${{ !cancelled() }}
        run: dotnet test src/housecarl-mcp-tests --configuration Release --no-build --filter "FullyQualifiedName~HarnessResidueTests" --logger "console;verbosity=detailed" --logger "trx;LogFileName=residue.trx"

      # Same measured hazard as the guard step's floor above, and it bites this step for its own reason: the
      # whole job here is to PRINT a measurement. Rename or split HarnessResidueTests — a plausible conversion-PR
      # edit — and this filter matches nothing, `dotnet test` exits 0, and the countdown silently stops being
      # reported with no signal in the log that a measurement disappeared. The gate itself survives (these are
      # tier=unit, so the guard step still runs them), so what goes quiet is the report rather than the guard —
      # but quiet-and-green is precisely the shape the step above rejects, so it gets the same floor, read off
      # this run's own trx.
      - name: Residue countdown — the run was not empty (a filter that matches nothing exits 0)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter residue.trx src/housecarl-mcp-tests/TestResults |
                 Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $trx) { throw "No residue.trx was produced - the countdown step did not run to completion." }
          $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          "residue.trx: total=$($c.total) executed=$($c.executed) passed=$($c.passed) failed=$($c.failed)"
          if ([int]$c.executed -eq 0) { throw "The residue countdown selected ZERO tests, so the measurement above was never made. Its filter no longer matches HarnessResidueTests." }
          if ([int]$c.failed -ne 0) { throw "$($c.failed) residue countdown test(s) failed." }

      # freshness-capture-guard runs as its OWN cold process: its deferral arm needs a write slow enough to
      # straddle a fixed ~100ms sleep — only true in a cold process. The warm ci-all runner finishes the write
      # too fast to land that race, so it is carved out here (cold). See FreshnessCaptureProbe's own summary.
      #
      # A step like this one is outside the reflected roster, which is how a guard could go unrun or uncounted
      # with everything green. CiWorkflowGuardStepTests derives the population from THIS FILE's OWN LINES:
      # every generator verb invoked here is either ci-all or a guard whose attribute flags it Standalone, and
      # every Standalone guard has a step. Adding a step that invokes an unattributed verb is a failing test —
      # naming the verb where the guard can read the invocation, and naming this line where it cannot, so an
      # invocation spelling it has not seen goes red rather than dropping out of the population.
      - name: Probe — freshness + write-capture (own cold process; timing-sensitive deferral arm)
        # Run even if ci-all failed (but not if the run was cancelled), so one red run still shows whether
        # freshness passes — the same "report every failure" posture as the ci-all runner itself.
        if: ${{ !cancelled() }}
        run: dotnet src/housecarl-generator/bin/Release/net9.0/housecarl-generator.dll freshness-capture-guard
