# Upstream watch — once a week, check whether SPID, KID, SkyPatcher, OAR, CommonLibSSE-NG and the
# other frameworks in upstream-pins.json have released past the version our skills were written
# against, and open or update one `upstream` issue per framework that has. The logic is
# scripts/upstream_watch.py; run it locally with --dry-run to see what it would do.
name: Upstream watch

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/upstream_watch.py
